<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eastern Vibes · Be.Ark x BCWC x Brand Brief</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070a0f">
<meta property="og:title" content="Eastern Vibes — MADStars Party Invitation">
<meta property="og:description" content="8.26 (Wed) 8:30 PM – 12:00 AM · Hosted by Be.Ark x BCWC x Brand Brief">
<link rel="icon" href="/logo.png">
<!--
  Eastern Vibes 파티 초대장 (2026-08-26, MADStars) — 초대용 QR의 랜딩.
  QR → 이 페이지 → 캘린더 추가 2버튼 (iOS = .ics / Google Calendar 템플릿 URL).
  캘린더 직행 대신 페이지를 끼운 이유: ics/구글 방식이 기기마다 갈려서 QR 하나로는
  한쪽이 반드시 깨진다. 파티 정보(장소 지도 링크)도 함께 보여 초대장 역할까지.
  일시 정본: 2026-08-26 (수) 20:30–24:00 KST. madstars.html과 같은 비주얼 토큰.
-->
<style>
  :root{
    --bg:#070a0f; --bg-soft:#0c1018; --ink:#f6f8fb; --ink-dim:#9aa6b8; --ink-faint:#5e6b7e;
    --accent:#c49c4d; --accent-soft:#c49c4d1f; --line:#1b2330;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
    font-family:Inter,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:28px 20px calc(40px + env(safe-area-inset-bottom));
    background-image:radial-gradient(620px 420px at 70% -5%, #c49c4d18, transparent 70%),
                     radial-gradient(520px 380px at 8% 12%, #863bff14, transparent 70%);
  }
  .card{width:100%; max-width:420px}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:22px;
         text-decoration:none; color:var(--ink); width:fit-content}
  .brand img{width:30px; height:30px; border-radius:8px}
  .brand span{font-weight:700; font-size:17px; letter-spacing:-.02em}
  .tag{display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em;
       color:var(--accent); background:var(--accent-soft); border:1px solid #c49c4d33;
       padding:5px 11px; border-radius:999px; margin-bottom:14px}
  h1{font-size:34px; line-height:1.15; letter-spacing:-.03em; font-weight:700}
  .host{color:var(--ink-dim); font-size:14px; margin-top:10px}
  .meta{margin:24px 0; padding:16px 18px; border:1px solid #c49c4d40; border-radius:18px;
        background:linear-gradient(180deg, #c49c4d14, transparent 60%), var(--bg-soft)}
  .meta-row{display:flex; gap:12px; padding:7px 0; font-size:14px}
  .meta-row .k{flex:none; width:64px; color:var(--ink-faint); font-size:12px; padding-top:2px}
  .meta-row .v{color:var(--ink)}
  .meta-row a{color:var(--accent); text-decoration:none; word-break:break-all}
  .btn{display:block; margin-top:12px; padding:15px; text-align:center; font-size:15px;
      font-weight:700; border-radius:12px; text-decoration:none;
      color:#1a1206; background:var(--accent)}
  .btn.ghost{color:var(--ink); background:var(--bg-soft); border:1px solid var(--line); font-weight:600}
  .foot{margin-top:26px; font-size:12px; color:var(--ink-faint); text-align:center}

  /* ── 파티 배경 일러스트 (2026-08-24 빠불로: LP·맥주로 파티 느낌) ──
     사진 대신 골드 라인아트 SVG — 외부 리소스 0, 텍스트 가독 위해 저채도/저투명. */
  .scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .card{position:relative; z-index:1}
  .deco{position:absolute; opacity:.5}
  .deco-lights{top:0; left:0; width:100%}
  .deco-vinyl{bottom:-30px; left:-40px; width:min(46vw,240px)}
  .deco-beer{bottom:-14px; right:-20px; width:min(38vw,200px)}
  #vinyl-disc{animation:spin 7s linear infinite; transform-origin:130px 120px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bulb{animation:glow 2.6s ease-in-out infinite}
  .bulb:nth-child(odd){animation-delay:1.3s}
  @keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
  @media (max-height:640px){.deco-vinyl,.deco-beer{display:none}}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <!-- 조명 스트링 -->
  <svg class="deco deco-lights" viewBox="0 0 420 90" fill="none">
    <path d="M-10 18 Q 105 62 210 34 T 430 30" stroke="#c49c4d" stroke-opacity=".5" stroke-width="1.5"/>
    <g>
      <circle class="bulb" cx="40"  cy="34" r="5" fill="#c49c4d"/>
      <circle class="bulb" cx="105" cy="50" r="5" fill="#e8c97a"/>
      <circle class="bulb" cx="170" cy="44" r="5" fill="#c49c4d"/>
      <circle class="bulb" cx="235" cy="32" r="5" fill="#e8c97a"/>
      <circle class="bulb" cx="300" cy="30" r="5" fill="#c49c4d"/>
      <circle class="bulb" cx="365" cy="34" r="5" fill="#e8c97a"/>
    </g>
  </svg>
  <!-- LP 턴테이블 -->
  <svg class="deco deco-vinyl" viewBox="0 0 260 200" fill="none" stroke="#c49c4d" stroke-width="2">
    <rect x="10" y="40" width="240" height="150" rx="14" stroke-opacity=".8"/>
    <g id="vinyl-disc">
      <circle cx="130" cy="120" r="62" stroke-opacity=".9"/>
      <circle cx="130" cy="120" r="48" stroke-opacity=".35"/>
      <circle cx="130" cy="120" r="36" stroke-opacity=".35"/>
      <circle cx="130" cy="120" r="20" fill="#c49c4d" fill-opacity=".28" stroke-opacity=".8"/>
      <circle cx="130" cy="120" r="3" fill="#c49c4d"/>
      <circle cx="130" cy="76" r="3.5" fill="#e8c97a" stroke="none"/>
    </g>
    <circle cx="222" cy="78" r="9"/>
    <path d="M222 78 L196 128 L188 142" stroke-linecap="round"/>
    <circle cx="188" cy="146" r="5" fill="#c49c4d" fill-opacity=".4"/>
  </svg>
  <!-- 맥주잔 2개 (건배) -->
  <svg class="deco deco-beer" viewBox="0 0 220 190" fill="none" stroke="#c49c4d" stroke-width="2">
    <g transform="rotate(-8 70 120)">
      <path d="M45 70 L52 168 Q52 176 60 176 L92 176 Q100 176 100 168 L107 70 Z" stroke-opacity=".85"/>
      <path d="M104 84 Q126 82 124 102 Q122 122 102 118" stroke-opacity=".7"/>
      <path d="M42 70 Q47 46 66 50 Q68 34 86 38 Q102 32 106 48 Q118 52 110 70 Z" fill="#e8c97a" fill-opacity=".22" stroke-opacity=".9"/>
      <line x1="62" y1="92" x2="66" y2="156" stroke-opacity=".3"/>
      <line x1="78" y1="92" x2="80" y2="158" stroke-opacity=".3"/>
    </g>
    <g transform="rotate(10 165 120)">
      <path d="M140 78 L146 170 Q146 178 154 178 L182 178 Q190 178 190 170 L196 78 Z" stroke-opacity=".85"/>
      <path d="M137 78 Q140 58 156 61 Q160 48 176 52 Q192 50 194 64 Q202 70 198 78 Z" fill="#e8c97a" fill-opacity=".22" stroke-opacity=".9"/>
      <line x1="156" y1="98" x2="160" y2="160" stroke-opacity=".3"/>
      <line x1="176" y1="98" x2="174" y2="162" stroke-opacity=".3"/>
    </g>
    <circle cx="120" cy="60" r="2.5" fill="#e8c97a" stroke="none"/>
    <circle cx="128" cy="44" r="2" fill="#c49c4d" stroke="none"/>
    <circle cx="112" cy="34" r="1.6" fill="#e8c97a" stroke="none"/>
  </svg>
</div>
<main class="card">
  <a class="brand" href="https://re-be.world/"><img src="/logo.png" alt=""><span>Be.Ark</span></a>

  <div class="tag">MADSTARS · BUSAN · 08.26</div>
  <h1>Eastern Vibes</h1>
  <p class="host">Be.Ark × BCWC × Brand Brief</p>

  <div class="meta">
    <div class="meta-row"><span class="k" id="k-when">일시</span>
      <span class="v" id="v-when">8.26 (수) 저녁 8:30 – 12:00</span></div>
    <div class="meta-row"><span class="k" id="k-where">장소</span>
      <span class="v"><a href="https://maps.app.goo.gl/X5stx86opKQ2FdT26" id="v-where">Google Maps에서 열기 ↗</a></span></div>
  </div>

  <a class="btn" id="btn-gcal"
     href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Eastern%20Vibes%20%E2%80%94%20Be.Ark%20x%20BCWC%20x%20Brand%20Brief&dates=20260826T203000%2F20260827T000000&ctz=Asia%2FSeoul&location=https%3A%2F%2Fmaps.app.goo.gl%2FX5stx86opKQ2FdT26&details=Hosted%20by%20Be.Ark%20x%20BCWC%20x%20Brand%20Brief%0AVenue%3A%20https%3A%2F%2Fmaps.app.goo.gl%2FX5stx86opKQ2FdT26%0AJoin%20Be.Ark%3A%20https%3A%2F%2Fre-be.world%2Fjoin%2Fmadstars"
     >Google 캘린더에 추가</a>
  <a class="btn ghost" id="btn-ics" href="/party/eastern-vibes.ics">Apple 캘린더에 추가 (.ics)</a>

  <p class="foot">Paulus Co.,Ltd. · re-be.world</p>

<script>
(function(){
  "use strict";
  // 한/영 자동 (madstars와 동일 규칙: ko* → 한국어, 그 외 영어)
  if ((navigator.language || '').toLowerCase().indexOf('ko') !== 0) {
    document.documentElement.lang = 'en';
    document.getElementById('k-when').textContent = 'When';
    document.getElementById('v-when').textContent = 'Wed, Aug 26 · 8:30 PM – 12:00 AM';
    document.getElementById('k-where').textContent = 'Where';
    document.getElementById('v-where').textContent = 'Open in Google Maps ↗';
    document.getElementById('btn-gcal').textContent = 'Add to Google Calendar';
    document.getElementById('btn-ics').textContent = 'Add to Apple Calendar (.ics)';
  }
})();
</script>
</main>
</body>
</html>
