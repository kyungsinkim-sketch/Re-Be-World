<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Be.Ark · 당신의 에이전트를 채용하세요 — 낯선대학 10주년</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070a0f">
<meta property="og:title" content="Hire your own AI agent — Be.Ark × 낯선대학 10주년">
<meta property="og:description" content="현장에서 에이전트를 채용하고 사원증을 받으세요. 집에서 QR로 접속하면 그 에이전트가 합류합니다.">
<meta property="og:image" content="https://www.re-be.world/landing/og-hero-2026.jpg">
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<!--
  낯선대학 10주년 (2026-09-12~13) 현장 "에이전트 채용" 페이지 — 빠불로 2026-09-11 발안.

  흐름: ① 채용(프리셋 6 + 이름 + 도트 얼굴) → ② 가입(이메일+비번, 확인메일 0회, billing event_signup(agent))
        → ③ 사원증(앱 AgentCard와 같은 규격) — 캔버스 PNG 1장(인화지 54×86mm 세로, 300dpi) 저장/인쇄 + QR
        → 집: QR(?home=1) → 앱 설치 → 같은 계정 로그인 → 앱이 계정 메타데이터의 에이전트를 생성(1.5.11+) + 쿠폰 자동 적용.
  얼굴 렌더 = 앱과 같은 코드(/join/beark-card.js = src/web/eventCard.ts 번들). 원장은 파츠 JSON, 그림은 알고리즘.
  기존 계정 = 로그인 후 claim_promo + event_agent(JWT).
  ?reset=1 = 이 기기의 진행 상태 초기화(현장 부스 기기에서 다음 사람으로 넘길 때).
  ?card=<base64url JSON> = 카드만 렌더(스태프 노트북에서 출력용 딥링크).
-->
<style>
  /* 앱과 같은 폰트: 본문·카드 = Geist Mono(앱 index.css html,body), "Be.Ark" 워드마크 = Pretendard Bold(앱 로컬 번들과 같은 파일) */
  @font-face{ font-family:'Pretendard'; font-weight:700; font-style:normal; font-display:swap; src:url('/join/fonts/Pretendard-Bold.woff2') format('woff2'); }
  :root{
    --bg:#070a0f; --bg-soft:#0c1018; --ink:#f6f8fb; --ink-dim:#9aa6b8; --ink-faint:#5e6b7e;
    --accent:#c49c4d; --accent-soft:#c49c4d1f; --line:#1b2330; --radius:18px;
    --danger:#ff6b6b; --ok:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
    font-family:Inter,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100dvh; display:flex; justify-content:center;
    padding:28px 20px calc(40px + env(safe-area-inset-bottom));
    background-image:radial-gradient(620px 420px at 70% -5%, #c49c4d18, transparent 70%),
                     radial-gradient(520px 380px at 8% 12%, #863bff14, transparent 70%);
  }
  /* 2026-09-12 빠불로(현장 사진 2차): 채용 흐름도 상단 콘텐츠와 같은 폭·글자·버튼 크기로 */
  .wrap{width:100%; max-width:920px}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:20px}
  .brand img{width:30px; height:30px; border-radius:8px}
  .brand span{font-weight:700; font-size:17px; letter-spacing:-.02em}
  .lang{margin-left:auto; display:flex; gap:2px; border:1px solid var(--line); border-radius:999px; padding:2px}
  .lang button{width:auto; margin:0; padding:5px 12px; font-size:12px; font-weight:600;
    background:transparent; color:var(--ink-faint); border:0; border-radius:999px; cursor:pointer}
  .lang button.on{background:var(--accent); color:#1a1206}
  .tag{display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em;
       color:var(--accent); background:var(--accent-soft); border:1px solid #c49c4d33;
       padding:5px 11px; border-radius:999px; margin-bottom:14px}
  h1{font-size:clamp(30px,4.6vw,46px); line-height:1.15; letter-spacing:-.03em; font-weight:800}
  .sub{color:var(--ink-dim); font-size:clamp(16px,2vw,20px); margin-top:12px}
  .sub b{color:var(--accent)}

  .step{margin-top:20px; padding:24px; border:1px solid var(--line); border-radius:var(--radius); background:var(--bg-soft)}
  .s-head{display:flex; align-items:center; gap:9px; margin-bottom:6px}
  .s-num{flex:none; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700;
         line-height:22px; text-align:center; color:var(--accent); border:1px solid #c49c4d55}
  .s-head h2{font-size:clamp(18px,2.4vw,24px); font-weight:700; letter-spacing:-.02em}
  .s-num{width:28px; height:28px; line-height:28px; font-size:14px}
  .s-done{margin-left:auto; font-size:12px; font-weight:700; color:var(--ok); display:none}
  .step.on .s-done{display:block}
  .s-desc{font-size:15px; line-height:1.7; color:var(--ink-dim); margin-bottom:16px}
  .step.locked{opacity:.45; pointer-events:none}

  /* 프리셋 6 */
  /* 2026-09-12 빠불로 3차: 채용 공고 3×3 고정, 글자·미니미 = 상단 유저 코멘트 크기(15px/1.7)에 맞춤 */
  .presets{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px}
  .preset{padding:16px 8px 14px; border:1px solid var(--line); border-radius:14px; background:#0f141d; text-align:center; cursor:pointer}
  .preset img{width:96px; height:96px; image-rendering:pixelated; border-radius:10px; display:block; margin:0 auto 10px}
  .preset .pn{font-size:17px; font-weight:700}
  .preset .pd{font-size:13.5px; color:var(--ink-dim); line-height:1.5; margin-top:4px; min-height:40px}
  @media(max-width:560px){
    .presets{gap:8px}
    .preset{padding:10px 6px 9px}
    .preset img{width:72px; height:72px; margin-bottom:6px}
    .preset .pn{font-size:14px} .preset .pd{font-size:11.5px; min-height:34px}
  }
  .preset.on{border-color:var(--accent); background:var(--accent-soft)}

  /* 꾸미기 (앱 AvatarPartsEditor 이식: 탭 9 + 파츠 격자 + 그 탭의 색만) */
  .editor{display:none; margin-top:12px; padding:12px; border:1px solid var(--line); border-radius:12px; background:#0f141d}
  .editor.show{display:block}
  .etabs{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px}
  .etabs button{width:auto; margin:0; padding:4px 9px; font-size:11px; border-radius:4px; background:transparent; color:var(--ink-faint); border:1px solid var(--line)}
  .etabs button.on{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
  .egrid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
  .egrid button{width:100%; aspect-ratio:1; margin:0; padding:0; border-radius:6px; overflow:hidden; background:#151b26; border:2px solid transparent}
  .egrid button.on{border-color:var(--accent)}
  .egrid img{width:100%; height:100%; display:block; image-rendering:pixelated}
  .ecolors{margin-top:10px}
  .ecolors .lab{font-size:11px; color:var(--ink-faint); margin-bottom:6px}
  .esw{display:flex; flex-wrap:wrap; gap:6px}
  .esw button{width:22px; height:22px; margin:0; padding:0; border-radius:50%; border:1px solid var(--line)}
  .esw button.on{border:2px solid #fff}
  .ebar{display:flex; gap:8px; margin-top:10px}
  .ebar button{margin:0; padding:9px; font-size:13px}
  label{display:block; font-size:15px; color:var(--ink-dim); margin:0 0 8px}
  input{width:100%; padding:16px 16px; font-size:17px; color:var(--ink); background:#0f141d; border:1px solid var(--line);
        border-radius:12px; outline:none; font-family:inherit}
  input:focus{border-color:var(--accent)}
  .field + .field{margin-top:14px}
  .hint{font-size:14px; color:var(--ink-faint); margin-top:8px; line-height:1.6}
  .face-row{display:flex; align-items:center; gap:14px; margin-top:14px}
  .face-row img{width:136px; height:136px; image-rendering:pixelated; border-radius:14px; border:1px solid var(--line); background:#0f141d; flex:none}
  @media(max-width:560px){ .face-row img{width:104px; height:104px} }
  .face-row .fr{flex:1}
  button{width:100%; margin-top:18px; padding:17px; font-size:18px; font-weight:700; font-family:inherit; color:#1a1206;
         background:var(--accent); border:0; border-radius:12px; cursor:pointer; letter-spacing:-.01em}
  button:disabled{opacity:.55; cursor:default}
  button.done{background:#3d4654; color:#9aa6b8; opacity:1; cursor:default}
  button.ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line); margin-top:0; padding:13px; font-size:15px}
  .msg{margin-top:14px; font-size:14px; padding:12px 14px; border-radius:11px; display:none}
  .msg.show{display:block}
  .msg.err{color:var(--danger); background:#ff6b6b14; border:1px solid #ff6b6b33}
  .msg.info{color:var(--ink-dim); background:#ffffff08; border:1px solid var(--line)}
  .coupon{display:none; margin-top:14px; padding:14px 16px; border-radius:12px; border:1px solid #c49c4d55; background:var(--accent-soft)}
  .coupon.show{display:block}
  .coupon b{color:var(--accent); font-size:17px}
  .coupon p{font-size:15px; color:var(--ink-dim); margin-top:4px}
  .dl{display:block; margin-top:12px; padding:17px; text-align:center; font-size:17px; font-weight:600; border-radius:12px;
      text-decoration:none; color:var(--ink); border:1px solid var(--line); background:var(--bg-soft)}
  .dl.primary{color:#1a1206; background:var(--accent); border-color:var(--accent)}
  .foot{margin-top:26px; font-size:12px; color:var(--ink-faint); text-align:center}
  .foot a{color:var(--ink-faint)}
  ol.home{margin:12px 0 0 18px; font-size:15px; line-height:1.7; color:var(--ink-dim)}
  ol.home li{margin:6px 0}

  /* ── 사원증 (앱 AgentCard 규격: ID-1 85.6×53.98mm, 어두운 바탕, 듀오톤 아바타 배경, 흰 글자) ── */
  .idcard{position:relative; width:100%; aspect-ratio:1.586; border-radius:4px; overflow:hidden; box-sizing:border-box;
          background:#0f1116; padding:7% 6%; display:flex; flex-direction:column; justify-content:space-between;
          border:1px solid var(--tint-30); box-shadow:0 8px 32px var(--tint-10), 0 0 0 1px var(--tint-05);
          font-family:"Geist Mono","JetBrains Mono","SF Mono","Apple SD Gothic Neo","Malgun Gothic",monospace,sans-serif; color:#fff}
  .idcard .bgimg{position:absolute; top:-4%; left:-4%; right:-4%; bottom:-4%; background-size:cover; background-position:center;
          filter:brightness(.25) saturate(.3) blur(1px); image-rendering:pixelated}
  .idcard .duo{position:absolute; inset:0; background:linear-gradient(135deg, var(--tint-12) 0%, transparent 50%, var(--tint-08) 100%); mix-blend-mode:screen}
  .idcard .fade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.1) 0%, rgba(0,0,0,.3) 40%, rgba(0,0,0,.75) 100%)}
  .idcard .scan{position:absolute; inset:0; pointer-events:none;
          background-image:repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,.03) 3px, rgba(0,0,0,.03) 4px)}
  .idcard .glow{position:absolute; top:-30px; right:-30px; width:150px; height:150px; border-radius:50%;
          background:radial-gradient(circle, var(--tint-15) 0%, transparent 70%)}
  .idcard .shine{position:absolute; inset:0; pointer-events:none; background:linear-gradient(135deg, var(--tint-16) 0%, transparent 55%)}
  .idcard .row{position:relative; z-index:2; display:flex; justify-content:space-between; align-items:flex-start}
  .idcard .brandl{display:flex; flex-direction:column; line-height:1.2}
  .idcard .brandl .b1{font-size:12.5px; font-weight:700; letter-spacing:.04em; color:var(--tint); font-family:Pretendard,"Geist Mono",sans-serif}
  .idcard .brandl .b2, .idcard .brandr{font-size:8.5px; color:rgba(255,255,255,.5); letter-spacing:.12em; text-transform:uppercase}
  .idcard .mid{position:relative; z-index:2; display:flex; align-items:center; gap:14px; min-width:0}
  .idcard .mid img{width:23%; aspect-ratio:1; border-radius:6px; image-rendering:pixelated; flex:none; border:1px solid var(--tint-30); background:#0f1116}
  .idcard .info{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
  .idcard .nm{font-size:19px; font-weight:700; color:#fff; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .idcard .fl{display:flex; align-items:baseline; gap:6px; min-width:0; font-size:10.5px; color:#fff}
  .idcard .fl span:first-child{white-space:nowrap; flex:none; letter-spacing:.02em}
  .idcard .fl span:last-child{min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .idcard .fl.role span:last-child{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .idcard .tags{display:flex; flex-wrap:wrap; gap:2px 8px; margin-top:2px; font-size:9px; color:var(--tint); opacity:.9}
  .idcard .bot{position:relative; z-index:2; display:flex; justify-content:space-between; align-items:flex-end; gap:12px}
  .idcard .no .v{font-size:15px; font-weight:700; color:#fff; line-height:1.1}
  .idcard .no .k{font-size:8px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.08em}
  .idcard .qr{width:23%; aspect-ratio:1; background:#fff; padding:3px; border-radius:3px; flex:none} /* 09-13: 개인 링크라 모듈 증가 → 조금 크게 */
  .idcard .qr svg{width:100%; height:100%; display:block}
  .idcard .qrlab{font-size:7.5px; color:rgba(255,255,255,.55); text-align:right; margin-top:2px; letter-spacing:.04em}
  .card-actions{display:flex; gap:8px; margin-top:12px}
  .card-actions button{margin-top:0}

  /* ── 2026-09-12 빠불로(현장 사진 보고): 부스에서 멀리서도 "어? AI 직원?" 하고 오게 —
     랜딩(ko/index.html) 히어로를 최상단에 그대로 + CTA 하나만(다운로드/텔레그램 ❌) → 유저 코멘트 → 영상 → 채용 흐름.
     히어로·코멘트·영상은 랜딩 폭(1080/860)으로 넓게, 채용 흐름은 기존 440 컬럼 유지. ── */
  body{display:block; padding:0 0 calc(40px + env(safe-area-inset-bottom))}
  .wrap{margin:0 auto; padding:0 20px}
  .promo{position:relative; z-index:1}
  .promo .pw{max-width:1080px; margin:0 auto; padding:0 24px}
  .topbar{display:flex; align-items:center; gap:10px; padding:16px 0 0}
  .topbar .brand{margin:0; flex:1}
  /* 09-13 빠불로(현장 사진): 첫 화면 = 아이맥에 CTA가 꽉 차게 — 히어로 상단 블록을 뷰포트 높이로, 글자·버튼 대폭 확대. 영상은 스크롤 아래 */
  .hero{padding:24px 0 40px; text-align:center; position:relative}
  .hero-top{min-height:calc(100vh - 120px); display:flex; flex-direction:column; justify-content:center; align-items:center}
  .pill{display:inline-flex; align-items:center; gap:8px; font-size:clamp(13px,1.4vw,18px); color:var(--ink-dim);
    border:1px solid var(--line); background:var(--bg-soft); padding:6px 14px; border-radius:999px; margin-bottom:22px}
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent)}
  .hero h1{font-size:clamp(44px,9vw,128px); line-height:1.04; letter-spacing:-.03em; font-weight:800}
  .hero h1 .hl{background:linear-gradient(120deg,var(--accent),#e6cf95); -webkit-background-clip:text; background-clip:text; color:transparent}
  .hero .hsub{max-width:900px; margin:26px auto 0; font-size:clamp(17px,2.6vw,30px); color:var(--ink-dim)}
  .hero .cta-row{display:flex; justify-content:center; margin-top:44px}
  .hero .cta{display:inline-flex; align-items:center; gap:10px; width:auto; margin:0; padding:clamp(20px,2.6vw,34px) clamp(38px,5vw,72px); font-size:clamp(20px,3.8vw,44px);
    font-weight:800; border-radius:16px; color:#15100a; background:var(--accent); text-decoration:none; letter-spacing:-.01em;
    box-shadow:0 14px 40px var(--accent-glow); transition:.2s; animation:pulse 2.6s ease-in-out infinite}
  .hero .cta:hover{transform:translateY(-2px); box-shadow:0 18px 50px var(--accent-glow)}
  @keyframes pulse{0%,100%{box-shadow:0 14px 40px var(--accent-glow)}50%{box-shadow:0 14px 56px #c49c4d77}}
  .hero .note{margin-top:18px; font-size:clamp(13px,1.4vw,18px); color:var(--ink-faint)}
  .float-agents{position:absolute; inset:0; z-index:0; pointer-events:none}
  .float-agents .fa{position:absolute; width:84px; height:84px; border-radius:50%; object-fit:cover; border:2px solid #c49c4d55;
    box-shadow:0 8px 30px #00000066,0 0 0 6px #c49c4d10; opacity:.92; animation:floaty 6s ease-in-out infinite}
  .float-agents .fa.a1{top:6%; left:13%; animation-delay:0s} .float-agents .fa.a2{top:34%; left:8%; animation-delay:1.4s}
  .float-agents .fa.a3{top:6%; right:13%; animation-delay:.7s} .float-agents .fa.a4{top:34%; right:8%; animation-delay:2.1s}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .hero .pw > *{position:relative; z-index:1}
  /* 랜딩 앱 목업 (대화 예시) */
  .mock{margin:40px auto 0; max-width:860px; border:1px solid var(--line); border-radius:var(--radius); text-align:left;
    background:linear-gradient(180deg,#0c101800,#080b11); overflow:hidden; box-shadow:0 30px 80px #00000088}
  .mock-bar{display:flex; align-items:center; gap:7px; padding:13px 16px; border-bottom:1px solid var(--line); background:#0a0e15}
  .mock-bar i{width:11px; height:11px; border-radius:50%; background:#2a312a; display:inline-block}
  .mock-bar i:nth-child(1){background:#ff5f57} .mock-bar i:nth-child(2){background:#febc2e} .mock-bar i:nth-child(3){background:#28c840}
  .mock-bar span{margin-left:10px; font-size:12px; color:var(--ink-faint)}
  .mock-body{display:grid; grid-template-columns:1fr; gap:14px; padding:22px}
  .mock .m{max-width:82%; padding:13px 16px; border-radius:14px; font-size:14.5px; display:block}
  .mock .m.user{justify-self:end; background:var(--accent-soft); border:1px solid #c49c4d33}
  .mock .m.ai{justify-self:start; background:#11151133; border:1px solid var(--line); color:var(--ink-dim); max-width:100%}
  .mock .m.ai b{color:var(--accent)}
  .agent-row{display:flex; align-items:flex-start; gap:11px; justify-self:start; max-width:88%}
  .agent-id{display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; width:46px}
  .agent-id .avatar{width:42px; height:42px; border-radius:50%; object-fit:cover; border:1px solid var(--line)}
  .agent-id .agent-name{font-size:10.5px; color:var(--ink-faint); font-weight:600; text-align:center; line-height:1.1}
  /* 실제 구동 영상 (목업 자리) */
  .demo{margin:40px auto 0; max-width:960px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    box-shadow:0 30px 80px #00000088; background:#0a0e15}
  .demo video{display:block; width:100%; height:auto; background:#0a0e15}
  /* 유저 코멘트 (ko/index.html testi 그대로) + 영상 */
  .sec-h{text-align:center; margin-bottom:26px}
  .sec-h h2{font-size:clamp(24px,4vw,36px); letter-spacing:-.02em}
  .sec-h p{color:var(--ink-dim); margin-top:8px; font-size:15px}

  function post(url, body, jwt){
    var headers = { "Content-Type":"application/json", "apikey":KEY };
    if (jwt) headers["Authorization"] = "Bearer " + jwt;
    return fetch(url, { method:"POST", headers:headers, body:JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { status:r.status, body:j }; }); });
  }
  var REASON_KEYS = ["invalid_email","weak_password","campaign_closed","not_open_yet","unknown_campaign","signup_failed"];

  function msg(text, kind){ var el = $("msg"); el.textContent = text; el.className = "msg show " + (kind || "info"); }
  function clearMsg(){ $("msg").className = "msg"; }
  function agentPayload(){ return { name: state.name, preset: state.preset, color: state.color, lang: lang, parts: state.parts }; }
  function showCoupon(promo){
    var el = $("coupon"); if (!promo || promo.attached === false) { el.className = "coupon"; return; }
    var exp = promo.spec && promo.spec.expires_at ? new Date(Number(promo.spec.expires_at) * 1000).toLocaleDateString(lang === "ko" ? "ko-KR" : "en-US") : "";
    $("coupon-sub").textContent = S("couponSub").replace("{date}", exp || "10.12");
    el.className = "coupon show";
  }

  var PRO_RETURN = "https://re-be.world/join/nachsun?home=1&pro=done";
  function mintProWithJwt(jwt){
    return post(FN, { type:"checkout", return_to: PRO_RETURN }, jwt).then(function(r){
      var url = r.status === 200 && r.body && r.body.url;
      if (!url) throw new Error((r.body && r.body.error) || ("http " + r.status));
      return String(url);
    });
  }
  function mintProFor(email, pw){
    return post(AUTH, { email:email, password:pw }).then(function(r){
      if (!r.body || !r.body.access_token) { var e = new Error("pw"); e.code = "pw"; throw e; }
      return mintProWithJwt(r.body.access_token);
    });
  }

    proMsg("promsg", "");

      .catch(function(e){ state.proUrl = ""; save(); renderPro(); $("proqr").textContent = S("proErr"); proMsg("promsg", S("proErr"), "err"); });
  }
  function finishSignup(email, promo, agentSaved){
    state.email = email; state.signedUp = true; state.promo = promo || null; state.no = makeNo(email + "|" + state.name); save();

    $("st-card").scrollIntoView({ behavior:"smooth", block:"start" });
  }
  // 이미 계정이 있는 참석자 = 같은 비밀번호로 로그인해서 쿠폰 + 에이전트만 담는다.
  function claimAsExisting(email, pw){
    msg(S("existingClaiming"), "info");
    var jwt = null;
    return post(AUTH, { email:email, password:pw }).then(function(r){
      if (!r.body || !r.body.access_token) { msg(S("existingPwWrong"), "err"); return null; }
      jwt = r.body.access_token;
      return post(FN, { type:"event_agent", campaign:CAMPAIGN, agent:agentPayload() }, jwt);
    }).then(function(r){
      if (!r) return null;
      var saved = r.status === 200 && r.body && r.body.ok;
      return post(FN, { type:"claim_promo", campaign:CAMPAIGN }, jwt).then(function(r2){
        var promo = (r2.body && r2.body.promo) || { attached:false, reason:(r2.body && r2.body.error) || "unknown" };
        finishSignup(email, promo, saved);
        prepareProQr(function(){ return mintProWithJwt(jwt); });
      });
    });
  }
  $("f").addEventListener("submit", function(e){
    e.preventDefault();
    var email = $("email").value.trim().toLowerCase(), pw = $("pw").value;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg(S("invalid_email"), "err"); return; }
    if (pw.length < 8) { msg(S("weak_password"), "err"); return; }
    var btn = $("submit"); btn.disabled = true; btn.textContent = S("signupBusy"); clearMsg();
    state.userName = $("uname").value.trim().slice(0, 80); state.org = $("uorg").value.trim().slice(0, 120); save();
    post(FN, { type:"event_signup", campaign:CAMPAIGN, email:email, password:pw, name:state.userName, company:state.org, agent:agentPayload() })
      .then(function(r){
        if (r.status === 200 && r.body.ok && r.body.existing) return claimAsExisting(email, pw);
        if (r.status === 200 && r.body.ok) {
          finishSignup(email, r.body.promo, r.body.agent_saved !== false);
          prepareProQr(function(){ return mintProFor(email, pw); }); // 새 계정 = 방금 만든 비번으로 로그인해 결제창 URL 발급
          return;
        }
        msg(reasonText((r.body && r.body.error) || r.status), "err");
      })
      .catch(function(){ msg(S("network"), "err"); })
      .then(function(){ btn.disabled = !!state.signedUp; btn.textContent = S("signupBtn"); if (state.signedUp) btn.classList.add("done"); });
  });

  // ── ③ 사원증 ────────────────────────────────────────────────────────────
  bindCardButtons(cardData);
  $("next-btn").addEventListener("click", function(){ location.href = location.pathname + "?reset=1"; });

  function cardData(){ return { name: state.name, preset: state.preset, color: state.color, parts: state.parts, no: state.no, joined: todayStr(), userName: state.userName || "" }; }
  function render(){
    var hired = !!(state.preset && state.name && state.parts);
    $("aname").value = state.name || "";
    if (state.parts) $("face").src = B.avatarPartsDataUrl(state.parts, 4); else $("face").removeAttribute("src");
    $("st-hire").classList.toggle("on", hired);
    $("st-signup").classList.toggle("locked", !hired);
    $("st-signup").classList.toggle("on", !!state.signedUp);
    $("st-card").classList.toggle("locked", !state.signedUp);
    $("st-card").classList.toggle("on", !!state.signedUp);
    var sb = $("submit"); sb.disabled = !!state.signedUp; sb.classList.toggle("done", !!state.signedUp);
    if (state.signedUp) { renderCard($("idcard"), cardData()); showCoupon(state.promo); $("email").value = state.email; }
    renderPro();
    renderCardQr();
  }
  // 2026-09-13 잉크 소진: 개인 QR = 집 모드 URL + 카드 JSON(b64url). 폰에서 열면 디지털 사원증 + 설치 링크.
  // 압축 코덱: 사원증 위 작은 QR에도 들어가게 (JSON 591자 → 파이프 결합 ≈ 220자). 필드 순서 = 계약(바꾸면 구 QR 깨짐).
  var PACK_KEYS = ["face","hair","eyes","mouth","cloth","glasses","hat","acc","bg"];
  var PACK_COLORS = ["skin","hair","cloth","glasses","hat","acc","iris","bg"];
  function packCard(d){
    var p = d.parts || {}, c = p.colors || {};
    var f = [d.name || "", d.preset || "", String(d.color || "").replace(/^#/, ""), d.no || "", d.joined || "", d.userName || ""];
    PACK_KEYS.forEach(function(k){ f.push(String(p[k] || "")); });
    PACK_COLORS.forEach(function(k){ f.push(String(c[k] || "").replace(/^#/, "")); });
    return b64u(f.join("|"));
  }
  function unpackCard(s){
    var f = unb64u(s).split("|"); if (f.length < 6 + PACK_KEYS.length + PACK_COLORS.length) return null;
    var parts = { v: 1, colors: {} }, i = 6;
    PACK_KEYS.forEach(function(k){ parts[k] = f[i++]; });
    PACK_COLORS.forEach(function(k){ parts.colors[k] = "#" + f[i++]; });
    return { name: f[0], preset: f[1], color: "#" + f[2], no: f[3], joined: f[4], userName: f[5], parts: parts };
  }
  function personalHomeUrl(d){ return HOME_URL + "&c=" + packCard(d); }
  function renderCardQr(){
    var q = $("cardqr"); if (!q) return;
    if (!state.signedUp || !state.parts) { q.textContent = ""; return; }
    q.innerHTML = B.qrSvg(personalHomeUrl(cardData()), 3, 0);
  }
  applyLang();
  if (!state.parts) { var p0 = B.AGENT_PRESETS[5]; state.parts = B.shuffleParts(p0.avatar); state.color = state.color || p0.color; render(); }
})();
</script>
