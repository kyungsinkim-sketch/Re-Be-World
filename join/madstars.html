<!--
  MADStars 파티(2026-08-26 해운대) 현장 미션 페이지.

  2026-08-24 한/영 이중화 (빠불로 지시): QR은 하나(같은 URL), 페이지에서 언어 토글.
   - 기본 언어 = 브라우저 언어 자동감지 (ko* → 한국어, 그 외 영어). 토글 선택은 localStorage 유지.
   - 문자열은 전부 STR 사전 + data-i18n 채움 — 동적 메시지는 S(key)로.

  2026-08-23 칩 미션 확장 (빠불로 발안):
   - 실물 칩 300개. 칩 1 = 드링크 1 / 칩 2 = 안주 1.
   - 미션 3개 = ① 케이스필름 시청 ② 현장가입 ③ Pro 3개월 쿠폰 등록 — 각 칩 1개.
   - 검증 = 스태프가 폰 화면의 스탬프를 눈으로 확인. 스탬프판에 가입 이메일 + 실시간 시계를
     같이 띄워 스크린샷 돌려쓰기를 막는다. (100명 규모 — 서버 검증 QR은 과설계.)
   - 백엔드: 쿠폰은 가입 때 서버가 붙이고(안전망), 미션 ③ 버튼은 로그인 → claim_promo(멱등)
     실제 왕복으로 쿠폰 스펙을 받아와야만 스탬프가 찍힌다. 보너스 결제 = checkout return_to(v21).

  설계 근거 (2026-08-20 실측, 유지):
   - 외부 스크립트 = YouTube IFrame API 하나뿐(영상 종료 감지용).
   - 이메일+비밀번호 = 데스크탑 앱 로그인(arkAuth.signInWithPassword)과 동일한 계정 경로.
   - 확인 메일 없음: billing 함수가 email_confirm:true로 서버에서 즉시 확정한다.
-->
<style>
  :root{
    --bg:#070a0f; --bg-soft:#0c1018; --ink:#f6f8fb; --ink-dim:#9aa6b8; --ink-faint:#5e6b7e;
    --accent:#c49c4d; --accent-soft:#c49c4d1f; --line:#1b2330; --radius:18px;
    --danger:#ff6b6b; --ok:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
    font-family:Inter,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    min-height:100dvh; display:flex; justify-content:center;
    padding:28px 20px calc(40px + env(safe-area-inset-bottom));
    background-image:radial-gradient(620px 420px at 70% -5%, #c49c4d18, transparent 70%),
                     radial-gradient(520px 380px at 8% 12%, #863bff14, transparent 70%);
  }
  .card{width:100%; max-width:420px}
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:20px}
  .brand img{width:30px; height:30px; border-radius:8px}
  .brand span{font-weight:700; font-size:17px; letter-spacing:-.02em}
  .lang{margin-left:auto; display:flex; gap:2px; border:1px solid var(--line); border-radius:999px; padding:2px}
  .lang button{width:auto; margin:0; padding:5px 12px; font-size:12px; font-weight:600;
    background:transparent; color:var(--ink-faint); border:0; border-radius:999px; cursor:pointer}
  .lang button.on{background:var(--accent); color:#1a1206}
  .tag{display:inline-block; font-size:12px; font-weight:600; letter-spacing:.04em;
       color:var(--accent); background:var(--accent-soft); border:1px solid #c49c4d33;
       padding:5px 11px; border-radius:999px; margin-bottom:14px}
  h1{font-size:25px; line-height:1.3; letter-spacing:-.03em; font-weight:700}
  .sub{color:var(--ink-dim); font-size:15px; margin-top:10px}
  .chip-rule{margin-top:12px; font-size:13px; color:var(--ink-faint)}
  .chip-rule b{color:var(--accent); font-weight:600}

  /* ── 스탬프판: 스태프가 이 화면을 보고 칩을 준다 ─────────────────────── */
  .board{margin:22px 0; padding:16px; border:1px solid #c49c4d40; border-radius:var(--radius);
         background:linear-gradient(180deg, #c49c4d14, transparent 60%), var(--bg-soft)}
  .board-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px}
  .board-title{font-size:13px; font-weight:700; letter-spacing:.06em; color:var(--accent)}
  .board-clock{font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
  .slots{display:flex; gap:10px}
  .slot{flex:1; text-align:center; padding:14px 6px 12px; border:1px dashed var(--line);
        border-radius:14px; background:#0f141d}
  .slot .mark{width:40px; height:40px; margin:0 auto 8px; border-radius:50%;
        border:2px dashed var(--ink-faint); color:var(--ink-faint);
        font-size:20px; font-weight:700; line-height:37px}
  .slot .name{font-size:12px; color:var(--ink-dim)}
  .slot.on{border-style:solid; border-color:#c49c4d66}
  .slot.on .mark{border:2px solid var(--accent); color:#1a1206; background:var(--accent);
        animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
  .slot.on .name{color:var(--ink)}
  @keyframes stamp{0%{transform:scale(1.9) rotate(-14deg); opacity:0} 100%{transform:scale(1) rotate(0); opacity:1}}
  .board-id{margin-top:12px; font-size:12px; color:var(--ink-faint); text-align:center;
        overflow-wrap:anywhere}
  .board-id b{color:var(--ink-dim); font-weight:600}

  /* ── 미션 카드 ────────────────────────────────────────────────────── */
  .mission{margin-top:16px; padding:17px; border:1px solid var(--line);
           border-radius:var(--radius); background:var(--bg-soft)}
  .m-head{display:flex; align-items:center; gap:9px; margin-bottom:6px}
  .m-num{flex:none; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700;
         line-height:22px; text-align:center; color:var(--accent); border:1px solid #c49c4d55}
  .m-head h2{font-size:16px; font-weight:700; letter-spacing:-.02em}
  .m-done{margin-left:auto; font-size:12px; font-weight:700; color:var(--ok); display:none}
  .mission.on .m-done{display:block}
  .m-desc{font-size:13px; color:var(--ink-faint); margin-bottom:12px}
  .video-wrap{position:relative; width:100%; aspect-ratio:16/9; border-radius:12px;
              overflow:hidden; background:#0f141d; border:1px solid var(--line)}
  .video-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
  .video-hold{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
              color:var(--ink-faint); font-size:14px; text-align:center; padding:0 20px}
  label{display:block; font-size:13px; color:var(--ink-dim); margin:0 0 7px}
  input{width:100%; padding:14px 15px; font-size:16px; /* 16px 미만이면 iOS가 화면을 확대한다 */
        color:var(--ink); background:#0f141d; border:1px solid var(--line);
        border-radius:12px; outline:none; font-family:inherit}
  input:focus{border-color:var(--accent)}
  .field + .field{margin-top:14px}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:7px}
  button{width:100%; margin-top:16px; padding:15px; font-size:16px; font-weight:700;
         font-family:inherit; color:#1a1206; background:var(--accent); border:0;
         border-radius:12px; cursor:pointer; letter-spacing:-.01em}
  button:disabled{opacity:.55; cursor:default}
  button.ghost{background:transparent; color:var(--ink-dim); border:1px solid var(--line)}
  .msg{margin-top:14px; font-size:14px; padding:12px 14px; border-radius:11px; display:none}
  .msg.show{display:block}
  .msg.err{color:var(--danger); background:#ff6b6b14; border:1px solid #ff6b6b33}
  .msg.info{color:var(--ink-dim); background:#ffffff08; border:1px solid var(--line)}
  .coupon{display:none; margin-top:14px; padding:14px 16px; border-radius:12px;
          border:1px solid #c49c4d55; background:var(--accent-soft)}
  .coupon.show{display:block}
  .coupon b{color:var(--accent); font-size:15px}
  .coupon p{font-size:13px; color:var(--ink-dim); margin-top:4px}
  .dl{display:block; margin-top:12px; padding:15px; text-align:center; font-size:15px;
      font-weight:600; border-radius:12px; text-decoration:none;
      color:var(--ink); border:1px solid var(--line); background:var(--bg-soft)}
  .dl.primary{color:#1a1206; background:var(--accent); border-color:var(--accent)}
  .foot{margin-top:26px; font-size:12px; color:var(--ink-faint); text-align:center}
  .foot a{color:var(--ink-faint)}
</style>
</head>

    </div>
    <div class="board-id" id="board-id"></div>
  </section>

  <!-- 미션 1: 케이스필름 -->
  <section class="mission" id="m-film">
    <div class="m-head"><span class="m-num">1</span><h2 data-i18n="m1Title"></h2><span class="m-done" data-i18n="done"></span></div>
    <p class="m-desc" data-i18n="m1Desc"></p>
    <div class="video-wrap" id="video-wrap">

  <!-- 미션 2: 현장가입 -->

    <p class="m-desc" data-i18n="m2Desc"></p>
    <form id="f" novalidate>
      <div class="field">
        <label for="email" data-i18n="email"></label>
        <input id="email" type="email" inputmode="email" autocomplete="email"
               autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="pw" data-i18n="pw"></label>
        <input id="pw" type="password" autocomplete="new-password" required>
        <p class="hint" data-i18n="pwHint"></p>
      </div>
      <button id="submit" type="submit" data-i18n="signupBtn"></button>
    </form>
    <div id="msg" class="msg"></div>
  </section>

  <!-- 미션 3: 쿠폰 등록 -->
  <section class="mission" id="m-promo">
    <div class="m-head"><span class="m-num">3</span><h2 data-i18n="m3Title"></h2><span class="m-done" data-i18n="done"></span></div>
    <p class="m-desc" data-i18n="m3Desc"></p>
    <button id="claim" type="button" data-i18n="claimBtn"></button>
    <div id="coupon" class="coupon">
      <b data-i18n="couponTitle"></b>
      <p id="coupon-sub"></p>
    </div>
    <div id="pay-area" style="display:none">
      <p class="hint" style="margin-top:14px" data-i18n="payHint"></p>
      <button id="pay" type="button" data-i18n="payBtn"></button>
    </div>
    <div id="msg2" class="msg"></div>
  </section>

  <!-- 다운로드 -->
  <section class="mission" id="m-dl">
    <div class="m-head"><h2 data-i18n="dlTitle"></h2></div>
    <p class="m-desc" data-i18n="dlDesc"></p>
    <a class="dl primary" href="https://re-be.world/#download" data-i18n="dlBtn"></a>
    <a class="dl" href="https://re-be.world/" data-i18n="dlExplore"></a>
  </section>

  <p class="foot">Paulus Co.,Ltd. · <a href="/privacy" data-i18n="privacy"></a></p>
</main>

      signupBtn: "Sign up", signupBusy: "Signing up…",
      m3Title: "Register your 3-month Pro coupon",
      m3Desc: "Registers a free 3-month Pro coupon to your account. No code to remember — it applies automatically at checkout.",
      claimBtn: "Register coupon", claimBusy: "Registering…",
      couponTitle: "MADSTARS · Pro free for 3 months",
      couponSub: "Coupon registered to your account. It applies automatically at checkout.",
      couponSubExp: "Coupon registered. Applies automatically at checkout · expires {date}",
      payHint: "Add a payment method now and Pro starts right away. $0 for 3 months, Apple Pay & Google Pay supported.",
      payBtn: "Start Pro now", payBusy: "Opening checkout…",
      paidBanner: "Payment method added — Pro has started! $0 for 3 months, cancel anytime.",
      payCancel: "Checkout was cancelled. Your coupon is still on your account — you can finish later in the app.",
      dlTitle: "Get Be.Ark",
      dlDesc: "No need to install right now — the coupon stays on your account.",
      dlBtn: "Download Be.Ark", dlExplore: "Explore re-be.world",
      privacy: "Privacy Policy",
      invalid_email: "Please double-check your email address.",
      weak_password: "Password must be at least 8 characters.",
      campaign_closed: "This event has ended.",
      not_open_yet: "The event hasn't started yet.",
      unknown_campaign: "This event link is not valid.",
      signup_failed: "Sign-up failed. Please try again in a moment.",
      unknownErr: "Something went wrong ({code})",
      existingClaiming: "This account already exists. Attaching your coupon…",
      existingPwWrong: "This email is already registered, but the password doesn't match — please use your original password.",
      claimWriteFailed: "Couldn't attach the coupon. Please tell the staff.",
      promoNotAttached: "Your account was created but the coupon wasn't attached — try again with the Mission 3 button.",
      needSignupFirst: "Please sign up in Mission 2 first. (If you refreshed, re-enter the email & password you used.)",
      loginFailed: "Login failed — please check your email and password.",
      network: "The network is unstable. Please tap again.",
      needClaimFirst: "Please register your coupon in Mission 3 first.",
      testSignup: "(Test) Skipped sign-up and stamped only.",
      testClaim: "(Test) Skipped coupon registration and stamped only."
    }
  };
  var lang = (function(){
    try { var s = localStorage.getItem(LS_LANG); if (s === 'ko' || s === 'en') return s; } catch(e){}
    return (navigator.language || '').toLowerCase().indexOf('ko') === 0 ? 'ko' : 'en';
  })();
  function S(key){ return STR[lang][key] || STR.ko[key] || key; }
  function applyLang(){
    document.documentElement.lang = lang;
    document.getElementById('lang-ko').className = lang === 'ko' ? 'on' : '';
    document.getElementById('lang-en').className = lang === 'en' ? 'on' : '';
    document.getElementById('h1').innerHTML = S('h1');
    document.getElementById('chip-rule').innerHTML = S('chipRule');
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = S(nodes[i].getAttribute('data-i18n'));
    document.getElementById('pw').placeholder = S('pwPh');
    var ft = document.getElementById('film-test-btn');
    if (ft) ft.textContent = S('filmTestBtn');
    render();
  }
  function setLang(l){ lang = l; try { localStorage.setItem(LS_LANG, l); } catch(e){} applyLang(); }
  document.getElementById('lang-ko').addEventListener('click', function(){ setLang('ko'); });
  document.getElementById('lang-en').addEventListener('click', function(){ setLang('en'); });

  var form = document.getElementById("f");
  var btn  = document.getElementById("submit");
  var claimBtn = document.getElementById("claim");
  var payBtn = document.getElementById("pay");
  var msgEl = document.getElementById("msg");
  var msg2El = document.getElementById("msg2");
  // 미션 ③ 로그인에서 받은 JWT — 보너스 결제 등록(checkout)에 재사용. 저장하지 않는다(메모리만).
  var sessionJwt = null;
  var lastCouponPromo = null; // 언어 토글 시 쿠폰 문구 다시 그리기용

  // ── 스탬프 상태: localStorage 영속 (파티장에서 새로고침해도 유지) ──────────
  var state = { film:false, signup:false, promo:false, email:"", paid:false };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(LS) || "{}")); } catch(e){}
  function save(){ try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} }

  function stamp(kind){
    if (state[kind]) { render(); return; }
    state[kind] = true; save(); render();
  }
  function render(){
    ["film","signup","promo"].forEach(function(k){
      var on = !!state[k];
      document.getElementById("slot-" + k).className = "slot" + (on ? " on" : "");
      var mid = { film:"m-film", signup:"m-signup", promo:"m-promo" }[k];
      document.getElementById(mid).className = "mission" + (on ? " on" : "");
      if (on) document.querySelector("#slot-" + k + " .mark").textContent = "✓";
    });
    var bid = document.getElementById("board-id");
    if (state.email) {
      bid.innerHTML = "";
      bid.appendChild(document.createTextNode(S('account')));
      var b = document.createElement("b"); b.textContent = state.email; bid.appendChild(b);
    } else { bid.innerHTML = ""; }
  }

  // 실시간 시계(KST) — 스크린샷 돌려쓰기 방지: 멈춘 시계 = 스샷.
  function tick(){
    var d = new Date(Date.now() + (9 * 60 + new Date().getTimezoneOffset()) * 60000);
    var p = function(n){ return (n < 10 ? "0" : "") + n; };
    document.getElementById("clock").textContent =
      "LIVE " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }
  setInterval(tick, 1000); tick();

  // ── 공통 fetch ─────────────────────────────────────────────────────────
  function post(url, body, jwt){
    var headers = { "Content-Type":"application/json", "apikey":KEY };
    if (jwt) headers["Authorization"] = "Bearer " + jwt;
    return fetch(url, { method:"POST", headers:headers, body:JSON.stringify(body) })
      .then(function(r){ return r.json().catch(function(){ return {}; })
        .then(function(j){ return { status:r.status, body:j }; }); });
  }

  // 서버가 돌려준 사유를 사람 말로. 모르는 값은 삼키지 말고 그대로 붙인다(원인이 화면까지 오게).
  var REASON_KEYS = ["invalid_email","weak_password","campaign_closed","not_open_yet","unknown_campaign","signup_failed"];
  function reasonText(code){
    if (REASON_KEYS.indexOf(code) >= 0) return S(code);
    return S('unknownErr').replace("{code}", String(code));
  }
  function msg(el, text, kind){ el.textContent = text; el.className = "msg show " + (kind || "info"); }
  function clearMsg(el){ el.className = "msg"; }

  // ── 미션 1: 케이스필름 ─────────────────────────────────────────────────
  // YT IFrame API로 '끝까지 재생(ENDED)'을 감지한다. 클라이언트 판정 —
  // 100명 파티 + 스태프 눈 검증 조합에 서버 판정까지 얹는 건 과설계.
  if (FILM_ID) {
    document.getElementById("video-hold").remove();
    var holder = document.createElement("div");
    holder.id = "yt-player";
    document.getElementById("video-wrap").appendChild(holder);
    window.onYouTubeIframeAPIReady = function(){
      new YT.Player("yt-player", {
        videoId: FILM_ID,
        playerVars: { rel:0, playsinline:1, modestbranding:1 },
        events: { onStateChange: function(e){ if (e.data === YT.PlayerState.ENDED) stamp("film"); } }
      });
    };
    var s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  } else if (TEST_MODE) {
    var tb = document.createElement("button");
    tb.type = "button"; tb.className = "ghost"; tb.id = "film-test-btn";
    tb.addEventListener("click", function(){ stamp("film"); });
    document.getElementById("film-test-area").appendChild(tb);
  }

  // ── 미션 2: 현장가입 ───────────────────────────────────────────────────
  function finishSignup(email, promoInfo){
    state.email = email || state.email; stamp("signup"); save(); render();
    if (promoInfo && promoInfo.attached === false) {
      msg(msgEl, S('promoNotAttached'), "info");
    } else {
      clearMsg(msgEl);
    }
    document.getElementById("m-promo").scrollIntoView({ behavior:"smooth", block:"center" });
  }

  // 이미 계정이 있는 참석자 = 같은 비밀번호로 로그인해서 쿠폰만 받는다.
  function claimAsExisting(email, pw){
    msg(msgEl, S('existingClaiming'), "info");
    return post(AUTH, { email:email, password:pw })
      .then(function(r){
        if (!r.body || !r.body.access_token) {
          msg(msgEl, S('existingPwWrong'), "err");
          return null;
        }
        sessionJwt = r.body.access_token;
        return post(FN, { type:"claim_promo", campaign:CAMPAIGN }, sessionJwt);
      })
      .then(function(r){
        if (!r) return;
        if (r.status === 200) {
          finishSignup(email, r.body.promo);
          showCoupon(r.body.promo); stamp("promo");
          return;
        }
        var reason = (r.body && r.body.promo && r.body.promo.reason) || (r.body && r.body.error) || "unknown";
        if (String(reason).indexOf("claim_write_failed") === 0) {
          msg(msgEl, S('claimWriteFailed'), "err");
        } else {
          msg(msgEl, reasonText(reason), "err");
        }
      });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var email = document.getElementById("email").value.trim().toLowerCase();
    var pw    = document.getElementById("pw").value;

    // TEST_MODE: 빈 채로 눌러도 다음 단계로 (실측 후 실동작 전환 — TEST_MODE=false)
    if (TEST_MODE && !email && !pw) {
      msg(msgEl, S('testSignup'), "info");
      state.email = "test@beark.dev"; stamp("signup");
      document.getElementById("m-promo").scrollIntoView({ behavior:"smooth", block:"center" });
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg(msgEl, S('invalid_email'), "err"); return; }
    if (pw.length < 8) { msg(msgEl, S('weak_password'), "err"); return; }

    btn.disabled = true;
    btn.textContent = S('signupBusy');
    clearMsg(msgEl);

    post(FN, { type:"event_signup", campaign:CAMPAIGN, email:email, password:pw })
      .then(function(r){
        if (r.status === 200 && r.body.ok && r.body.existing) return claimAsExisting(email, pw);
        // 신규 가입 성공: 서버가 쿠폰까지 붙여뒀지만(안전망) 스탬프 3은 미션 ③ 버튼의
        // claim_promo 왕복(멱등)으로만 찍는다 — "등록" 행동과 검증이 진짜가 되도록.
        if (r.status === 200 && r.body.ok) return finishSignup(email, null);
        msg(msgEl, reasonText((r.body && r.body.error) || "unknown"), "err");
      })
      .catch(function(){
        msg(msgEl, S('network'), "err");
      })
      .then(function(){
        btn.disabled = false;
        btn.textContent = S('signupBtn');
      });
  });

  // ── 미션 3: 쿠폰 등록 (로그인 → claim_promo 멱등 왕복) ─────────────────
  function showCoupon(promo){
    lastCouponPromo = promo || lastCouponPromo;
    var el = document.getElementById("coupon");
    el.className = "coupon show";
    var sub = document.getElementById("coupon-sub");
    var spec = lastCouponPromo && lastCouponPromo.spec;
    if (state.paid) {
      sub.textContent = S('paidBanner');
    } else if (spec && spec.expires_kst) {
      sub.textContent = S('couponSubExp').replace("{date}", String(spec.expires_kst).slice(0, 16));
    } else {
      sub.textContent = S('couponSub');
    }
    // 보너스: JWT가 있을 때만 결제 등록 버튼 노출 (칩 조건 아님 — 쿠폰 스탬프까지가 미션)
    if (sessionJwt && !state.paid) document.getElementById("pay-area").style.display = "block";
  }

  claimBtn.addEventListener("click", function(){
    var email = document.getElementById("email").value.trim().toLowerCase() || state.email;
    var pw    = document.getElementById("pw").value;

    if (TEST_MODE && (!email || email === "test@beark.dev") && !pw) {
      msg(msg2El, S('testClaim'), "info");
      showCoupon(null); stamp("promo");
      return;
    }
    if (!email || !pw) {
      msg(msg2El, S('needSignupFirst'), "info");
      return;
    }

    claimBtn.disabled = true;
    claimBtn.textContent = S('claimBusy');
    clearMsg(msg2El);

    post(AUTH, { email:email, password:pw })
      .then(function(r){
        if (!r.body || !r.body.access_token) {
          msg(msg2El, S('loginFailed'), "err");
          return null;
        }
        sessionJwt = r.body.access_token;
        return post(FN, { type:"claim_promo", campaign:CAMPAIGN }, sessionJwt);
      })
      .then(function(r){
        if (!r) return;
        if (r.status === 200 && r.body.ok) {
          showCoupon(r.body.promo);
          state.email = email; stamp("promo");
          return;
        }
        var reason = (r.body && r.body.promo && r.body.promo.reason) || (r.body && r.body.error) || "unknown";
        msg(msg2El, reasonText(reason), "err");
      })
      .catch(function(){
        msg(msg2El, S('network'), "err");
      })
      .then(function(){
        claimBtn.disabled = false;
        claimBtn.textContent = S('claimBtn');
      });
  });

  // ── 보너스: 결제수단 등록 → Pro 즉시 시작 (칩 조건 아님) ────────────────
  // Stripe 호스티드 체크아웃으로 이동 — 모바일에선 Apple/Google Pay가 떠서 타이핑이 없다.
  // 쿠폰이 계정에 붙어 있어 첫 3개월 0원이 자동 적용된다(checkout이 discounts로 주입).
  payBtn.addEventListener("click", function(){
    if (!sessionJwt) {
      msg(msg2El, S('needClaimFirst'), "info");
      return;
    }
    payBtn.disabled = true;
    payBtn.textContent = S('payBusy');
    post(FN, { type:"checkout", return_to:"https://re-be.world/join/madstars" }, sessionJwt)
      .then(function(r){
        if (r.status === 200 && r.body.url) { location.href = r.body.url; return; }
        msg(msg2El, reasonText((r.body && r.body.error) || "unknown"), "err");
        payBtn.disabled = false;
        payBtn.textContent = S('payBtn');
      })
      .catch(function(){
        msg(msg2El, S('network'), "err");
        payBtn.disabled = false;
        payBtn.textContent = S('payBtn');
      });
  });

  // Stripe에서 복귀: ?billing=success|cancel (백엔드 return_to가 이 페이지로 돌려보낸다)
  var billing = new URLSearchParams(location.search).get("billing");
  if (billing === "success") {
    state.paid = true; save();
    showCoupon(null);
    history.replaceState(null, "", location.pathname);
  } else if (billing === "cancel") {
    msg(msg2El, S('payCancel'), "info");
    history.replaceState(null, "", location.pathname);
  }
  if (state.paid) { document.getElementById("pay-area").style.display = "none"; showCoupon(null); }

  applyLang();
})();
</script>
</body>
</html>
